    <script>
      // 交互页面接管前显示布局占位；无脚本或加载失败时保留可阅读的静态内容。
      (() => {
        const root = document.documentElement;
        root.classList.add('app-starting');
        let fallbackTimer;
        const finish = () => {
          root.classList.remove('app-starting');
          clearTimeout(fallbackTimer);
          window.removeEventListener('youngbar:startup-finished', finish);
          window.removeEventListener('vite:preloadError', finish);
          window.removeEventListener('error', onScriptError, true);
        };
        const onScriptError = (event) => {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') finish();
        };
        window.addEventListener('youngbar:startup-finished', finish);
        window.addEventListener('vite:preloadError', finish);
        window.addEventListener('error', onScriptError, true);
        fallbackTimer = window.setTimeout(finish, 10000);
      })();
    </script>
