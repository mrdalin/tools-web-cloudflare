name: 定时清理临时聊天室

on:
  schedule:
    # 每天 UTC 时间 0:00 执行 (北京时间 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  clean-chat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 清理一个月前的聊天消息
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://youngbar.com/cron/clean-chat"
