name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build:pro

      - name: Run tests
        run: node --test tests/**/*.test.js

      - name: Install browser for smoke tests
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run browser smoke tests against Cloudflare Pages build
        run: pnpm test:browser

      - name: Upload browser traces after a failed check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
