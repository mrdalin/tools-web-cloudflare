<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>页面不存在-Youngbar工具箱</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2937; background: #f8fafc; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(92vw, 30rem); padding: 2.5rem; text-align: center; background: #fff; border: 1px solid #e5e7eb; border-radius: 1rem; box-shadow: 0 1rem 3rem rgb(15 23 42 / 8%); }
      .code { margin: 0; color: #2563eb; font-size: 4rem; font-weight: 800; line-height: 1; }
      h1 { margin: 1rem 0 0; font-size: 1.5rem; }
      p { margin: 0.75rem 0 1.5rem; color: #64748b; }
      a { color: #2563eb; font-weight: 600; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>页面不存在</h1>
      <p>你访问的地址可能已失效，或资源尚未发布。</p>
      <a href="/">返回首页</a>
    </main>
  </body>
</html>
